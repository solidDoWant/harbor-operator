---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - harbor.soliddowant.dev
  resources:
  - harborconnections
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - harbor.soliddowant.dev
  resources:
  - harborconnections/finalizers
  verbs:
  - update
- apiGroups:
  - harbor.soliddowant.dev
  resources:
  - harborconnections/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - harbor.soliddowant.dev
  resources:
  - harborprojects
  verbs:
  - get
  - list
  - watch
