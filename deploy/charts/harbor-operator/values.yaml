# -- Number of operator replicas. Leader election keeps one of them active.
replicaCount: 1
image:
  # -- Operator image repository.
  repository: ghcr.io/soliddowant/harbor-operator
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Names of image pull Secrets.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""
crds:
  # -- Install the CRDs with the chart. Set to false when you manage them yourself.
  install: true
serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the full name.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}
leaderElection:
  # -- Enable leader election.
  enabled: true
# -- Namespaces that the operator watches. Empty means all namespaces. See docs/admin/install.md.
watchNamespaces: []
metrics:
  # -- Port of the metrics endpoint.
  port: 8443
  # -- Serve metrics over HTTPS with authentication and authorization.
  secure: true
grafanaDashboard:
  configMap:
    # -- Render a ConfigMap with the dashboard for Grafana's dashboard sidecar.
    enabled: false
    # -- Labels on the dashboard ConfigMap. The sidecar selects ConfigMaps by this label.
    labels:
      grafana_dashboard: "1"
  grafanaOperator:
    # -- Render a grafana-operator GrafanaDashboard with the dashboard inline.
    enabled: false
    # -- Selects the Grafana instances that get the dashboard.
    instanceSelector:
      matchLabels:
        dashboards: grafana
resources:
  requests:
    # -- CPU request. There is no CPU limit.
    cpu: 10m
    # -- Memory request.
    memory: 128Mi
  limits:
    # -- Memory limit. Keep it equal to the memory request.
    memory: 128Mi
# -- Extra arguments for the operator binary.
extraArgs: []
# -- Pod annotations.
podAnnotations: {}
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
networkPolicy:
  # -- Create a NetworkPolicy that limits egress to the API server, Harbor and DNS.
  enabled: false
  apiServer:
    # -- CIDRs of the Kubernetes API server (the `kubernetes` Service IP and the control plane node IPs). Required when the policy is enabled.
    cidrs: []
    # -- Ports of the API server.
    ports: [443, 6443]
  harborEgress:
    # -- Where Harbor is. A list of NetworkPolicy peers: `ipBlock`, or `podSelector` with `namespaceSelector`. Leave empty to allow any destination on the Harbor ports.
    peers: []
    # -- Ports of the Harbor URL.
    ports: [443]
  dns:
    # -- Labels of the namespace that runs the cluster DNS.
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    # -- Labels of the cluster DNS pods.
    podLabels:
      k8s-app: kube-dns
podDisruptionBudget:
  # -- Create a PodDisruptionBudget.
  enabled: false
  # -- Number of pods that may be unavailable.
  maxUnavailable: 1
