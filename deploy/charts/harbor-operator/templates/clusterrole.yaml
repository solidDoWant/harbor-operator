{{- if not .Values.watchNamespaces }}
# The manager's rules in every namespace. With watchNamespaces set, namespaced-rbac.yaml grants them per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harbor-operator.fullname" . }}
  labels:
    {{- include "harbor-operator.labels" . | nindent 4 }}
{{ include "harbor-operator.managerRules" . }}
{{- else }}
# allowedNamespaces label selectors read the labels of Namespaces, which are cluster-scoped, so reading Namespaces
# stays a cluster-wide grant even when watchNamespaces limits everything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harbor-operator.fullname" . }}-namespaces
  labels:
    {{- include "harbor-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
{{- end }}
