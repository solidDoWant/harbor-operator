{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: harborretentionpolicies.harbor.soliddowant.dev
spec:
  group: harbor.soliddowant.dev
  names:
    categories:
    - harbor
    kind: HarborRetentionPolicy
    listKind: HarborRetentionPolicyList
    plural: harborretentionpolicies
    shortNames:
    - hret
    singular: harborretentionpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.projectRef.name
      name: Project
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HarborRetentionPolicy is the tag retention policy of a project.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HarborRetentionPolicySpec is the desired tag retention policy
              of one project.
            properties:
              deletionPolicy:
                description: DeletionPolicy empty means the connection's default.
                enum:
                - Delete
                - DeleteWithContents
                - Orphan
                type: string
              projectRef:
                description: ProjectRef names the HarborProject. Its allowedNamespaces
                  must admit this namespace. Immutable.
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the object. Empty means the namespace
                      of the referring resource.
                    type: string
                required:
                - name
                type: object
              resyncInterval:
                description: ResyncInterval empty means the connection's default.
                type: string
              rules:
                items:
                  description: RetentionRule is one tag retention rule.
                  properties:
                    count:
                      description: Count is K, N or the number of days, depending
                        on the template.
                      format: int32
                      type: integer
                    disabled:
                      type: boolean
                    repositories:
                      description: RepositorySelector picks repositories by a doublestar
                        pattern.
                      properties:
                        decoration:
                          description: Decoration says whether the pattern includes
                            or excludes.
                          enum:
                          - repoMatches
                          - repoExcludes
                          type: string
                        pattern:
                          description: Pattern is a doublestar pattern, for example
                            `**`.
                          maxLength: 255
                          minLength: 1
                          type: string
                      required:
                      - decoration
                      - pattern
                      type: object
                    tags:
                      description: TagSelector picks tags by a doublestar pattern.
                        It is used by retention rules.
                      properties:
                        decoration:
                          description: Decoration says whether the pattern includes
                            or excludes.
                          enum:
                          - matches
                          - excludes
                          type: string
                        pattern:
                          description: Pattern is a doublestar pattern, for example
                            `**`.
                          maxLength: 255
                          minLength: 1
                          type: string
                        untagged:
                          description: Untagged also selects artifacts that have no
                            tag.
                          type: boolean
                      required:
                      - decoration
                      - pattern
                      type: object
                    template:
                      description: Template is the retention template.
                      enum:
                      - latestPushedK
                      - latestPulledN
                      - nDaysSinceLastPush
                      - nDaysSinceLastPull
                      - always
                      type: string
                  required:
                  - repositories
                  - tags
                  - template
                  type: object
                  x-kubernetes-validations:
                  - message: count is required and must be greater than 0, except
                      for the always template, which takes no count
                    rule: 'self.template == ''always'' ? !has(self.count) : (has(self.count)
                      && self.count > 0)'
                maxItems: 15
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              schedule:
                description: Schedule is a Harbor cron expression with six fields
                  (seconds first). Empty means manual runs only.
                maxLength: 255
                type: string
            required:
            - projectRef
            - rules
            type: object
          status:
            description: HarborRetentionPolicyStatus is the observed state of a HarborRetentionPolicy.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              harborKey:
                description: HarborKey is the Harbor identity, object type and project
                  name this resource claims.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled.
                format: int64
                type: integer
              projectID:
                description: ProjectID in Harbor of the project this policy belongs
                  to.
                format: int32
                type: integer
              retentionID:
                description: RetentionID in Harbor.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.projectRef is immutable
          rule: self.spec.projectRef == oldSelf.spec.projectRef
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
