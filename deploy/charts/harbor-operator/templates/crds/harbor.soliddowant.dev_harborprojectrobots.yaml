{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: harborprojectrobots.harbor.soliddowant.dev
spec:
  group: harbor.soliddowant.dev
  names:
    kind: HarborProjectRobot
    listKind: HarborProjectRobotList
    plural: harborprojectrobots
    singular: harborprojectrobot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.harborName
      name: Harbor Name
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HarborProjectRobot is a project-level robot account in Harbor.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HarborProjectRobotSpec is the desired state of a project
              robot account.
            properties:
              adopt:
                type: boolean
              deletionPolicy:
                description: DeletionPolicy empty means the connection's default.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                type: string
              disabled:
                type: boolean
              duration:
                default: -1
                description: Duration in days. -1 means the robot never expires.
                format: int64
                type: integer
                x-kubernetes-validations:
                - message: duration must be -1 or between 1 and 2147483646
                  rule: self == -1 || (self >= 1 && self <= 2147483646)
              name:
                description: Name of the robot. Defaults to metadata.name. Immutable.
                maxLength: 255
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              permissions:
                items:
                  description: 'RobotAccess is one permission: an action on a resource
                    of the robot''s project.'
                  properties:
                    action:
                      description: Action is a Harbor action, for example push.
                      maxLength: 32
                      minLength: 1
                      type: string
                    resource:
                      description: Resource is a Harbor resource, for example repository.
                      maxLength: 32
                      minLength: 1
                      type: string
                  required:
                  - action
                  - resource
                  type: object
                  x-kubernetes-validations:
                  - message: resource and action must be a pair from the list in docs/user/robot-permissions.md
                    rule: '[''accessory:list'',''artifact:delete'',''artifact:list'',''artifact:read'',''artifact-label:create'',''artifact-label:delete'',''configuration:read'',''configuration:update'',''export-cve:create'',''export-cve:read'',''immutable-tag:create'',''immutable-tag:delete'',''immutable-tag:list'',''immutable-tag:update'',''label:create'',''label:delete'',''label:list'',''label:read'',''label:update'',''log:list'',''member:create'',''member:delete'',''member:list'',''member:read'',''member:update'',''metadata:create'',''metadata:delete'',''metadata:list'',''metadata:read'',''metadata:update'',''notification-policy:create'',''notification-policy:delete'',''notification-policy:list'',''notification-policy:read'',''notification-policy:update'',''preheat-policy:create'',''preheat-policy:delete'',''preheat-policy:list'',''preheat-policy:read'',''preheat-policy:update'',''quota:read'',''repository:create'',''repository:delete'',''repository:list'',''repository:pull'',''repository:push'',''repository:read'',''repository:update'',''robot:create'',''robot:delete'',''robot:list'',''robot:read'',''robot:update'',''sbom:create'',''sbom:read'',''sbom:stop'',''scan:create'',''scan:read'',''scan:stop'',''scanner-pull:read'',''tag:create'',''tag:delete'',''tag:list'',''tag-retention:create'',''tag-retention:delete'',''tag-retention:list'',''tag-retention:operate'',''tag-retention:read'',''tag-retention:update''].exists(p,
                      p == self.resource + '':'' + self.action)'
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              projectRef:
                description: ObjectReference points at an object of another kind.
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the object. Empty means the namespace
                      of the referring resource.
                    type: string
                required:
                - name
                type: object
              resyncInterval:
                description: ResyncInterval empty means the connection's default.
                type: string
              secret:
                default: {}
                description: RobotSecretSpec says which Secrets hold the robot's credentials.
                  They are written to the robot's own namespace.
                properties:
                  dockerConfigJSON:
                    description: DockerConfigJSON is a kubernetes.io/dockerconfigjson
                      Secret. Enabled by default.
                    properties:
                      enabled:
                        description: Enabled turns the Secret on.
                        type: boolean
                      name:
                        description: Name of the Secret. Defaults to <resource name>-dockerconfig
                          or <resource name>-credentials.
                        type: string
                    type: object
                  opaque:
                    description: Opaque is a Secret with the keys username, password
                      and registry. Disabled by default.
                    properties:
                      enabled:
                        description: Enabled turns the Secret on.
                        type: boolean
                      name:
                        description: Name of the Secret. Defaults to <resource name>-dockerconfig
                          or <resource name>-credentials.
                        type: string
                    type: object
                  rotate:
                    description: Rotate is any string. Changing it refreshes the robot's
                      secret.
                    type: string
                type: object
            required:
            - permissions
            - projectRef
            type: object
          status:
            description: |-
              HarborProjectRobotStatus is the observed state of a HarborProjectRobot. The secret hash is kept in an annotation on
              each Secret, never here.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createPending:
                description: |-
                  CreatePending is set just before the operator asks Harbor to create the robot, and cleared once its Secrets hold
                  the new secret. A robot found in Harbor counts as this resource's own interrupted create only when it was created
                  no earlier than this time, less a clock-skew allowance.
                format: date-time
                type: string
              expiresAt:
                description: ExpiresAt is when the robot expires. Unset means never.
                format: date-time
                type: string
              harborKey:
                description: HarborKey is the Harbor identity, project name and robot
                  name this resource claims.
                type: string
              harborName:
                description: HarborName is the robot's name as Harbor returned it,
                  including Harbor's prefix.
                type: string
              lastRotated:
                description: LastRotated is when the secret was last refreshed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled.
                format: int64
                type: integer
              observedRotate:
                description: ObservedRotate is the last spec.secret.rotate value acted
                  on.
                type: string
              robotID:
                description: RobotID in Harbor.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.name is immutable
          rule: '(has(self.spec.name) ? self.spec.name : self.metadata.name) == (has(oldSelf.spec.name)
            ? oldSelf.spec.name : oldSelf.metadata.name)'
        - message: spec.projectRef is immutable
          rule: self.spec.projectRef == oldSelf.spec.projectRef
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
