{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: harborregistries.harbor.soliddowant.dev
spec:
  group: harbor.soliddowant.dev
  names:
    kind: HarborRegistry
    listKind: HarborRegistryList
    plural: harborregistries
    singular: harborregistry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.health
      name: Health
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HarborRegistry is a registry endpoint in Harbor.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HarborRegistrySpec is the desired state of a Harbor registry
              endpoint, the upstream of a proxy cache.
            properties:
              adopt:
                description: Adopt lets this resource take over an existing registry
                  of the same name.
                type: boolean
              allowedNamespaces:
                description: AllowedNamespaces admits the HarborProjects that may
                  use this registry as a proxy-cache upstream.
                properties:
                  names:
                    description: Names is an explicit list of namespace names.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: Selector admits every namespace whose labels match.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              connectionRef:
                description: ConnectionRef names the HarborConnection. Its systemAllowedNamespaces
                  must admit this namespace.
                properties:
                  name:
                    description: Name of the object.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the object. Empty means the namespace
                      of the referring resource.
                    type: string
                required:
                - name
                type: object
              credentialsSecretRef:
                description: CredentialsSecretRef names a Secret in this namespace
                  with the keys accessKey and accessSecret.
                properties:
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                description: DeletionPolicy empty means the connection's default.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                type: string
              insecure:
                description: Insecure skips certificate checks on the upstream.
                type: boolean
              name:
                description: Name of the registry in Harbor. Defaults to metadata.name.
                  Immutable.
                maxLength: 255
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              resyncInterval:
                description: ResyncInterval empty means the connection's default.
                type: string
              type:
                description: Type is the Harbor adapter type, for example docker-hub
                  or github-ghcr. Immutable. Harbor checks the value.
                maxLength: 64
                pattern: ^[a-z0-9]+(?:[._-][a-z0-9]+)*$
                type: string
              url:
                description: URL of the upstream registry. No user information and
                  no trailing slash.
                maxLength: 2048
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: url must not end with a slash
                  rule: '!self.endsWith(''/'')'
                - message: url must not contain user information
                  rule: '!self.matches(''^[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*@'')'
            required:
            - connectionRef
            - type
            - url
            type: object
          status:
            description: HarborRegistryStatus is the observed state of a HarborRegistry.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createPending:
                description: |-
                  CreatePending is set just before the operator asks Harbor to create the registry, and cleared once the ID is
                  recorded or Harbor refuses the create.
                format: date-time
                type: string
              harborKey:
                description: HarborKey is the Harbor identity, object type and registry
                  name this resource claims.
                type: string
              health:
                description: Health is the result of the last ping of the upstream.
                  It never changes Ready.
                enum:
                - healthy
                - unhealthy
                - unknown
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation reconciled.
                format: int64
                type: integer
              registryID:
                description: RegistryID in Harbor.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.name is immutable
          rule: '(has(self.spec.name) ? self.spec.name : self.metadata.name) == (has(oldSelf.spec.name)
            ? oldSelf.spec.name : oldSelf.metadata.name)'
        - message: spec.type is immutable
          rule: self.spec.type == oldSelf.spec.type
        - message: spec.connectionRef is immutable
          rule: self.spec.connectionRef == oldSelf.spec.connectionRef
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
