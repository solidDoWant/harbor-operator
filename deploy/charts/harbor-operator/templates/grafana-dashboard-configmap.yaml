{{- if .Values.grafanaDashboard.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harbor-operator.fullname" . }}-dashboard
  labels:
    {{- include "harbor-operator.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  harbor-operator.json: |
    {{- .Files.Get "dashboards/harbor-operator.json" | nindent 4 }}
{{- end }}
