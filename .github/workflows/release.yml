name: release

# A version tag v<version>, pushed by the release-manager on a master commit
# after `make release VERSION=<version>` (the dry run) passed, publishes:
#   - the image ghcr.io/soliddowant/harbor-operator:<version> (linux/amd64 and
#     linux/arm64; plus :latest for a final version);
#   - the Helm chart oci://ghcr.io/soliddowant/charts/harbor-operator;
#   - the GitHub release v<version>, with the CHANGELOG.md section of the
#     version as its notes.
# The image and chart steps are skipped until the image build and the chart
# exist, so the workflow keeps its shape from the start.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write # the GitHub release
  packages: write # the image and chart on ghcr.io

# One release at a time; a running release always finishes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p build
          ./scripts/changelog-section.sh "$version" > build/release-notes.md
      - uses: ./.github/actions/nix-dev-shell
      - name: Sign in to ghcr.io
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | nix develop -c crane auth login ghcr.io --username "$GHCR_USER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | nix develop -c helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Push the image
        run: |
          nix develop -c make build-images VERSION="$VERSION" PUSH_ALL=true
          image="ghcr.io/soliddowant/harbor-operator:$VERSION"
          if ! nix develop -c crane digest "$image" >/dev/null 2>&1; then
            echo "::warning::$image was not pushed (no image build yet); skipping the image"
            exit 0
          fi
          case "$VERSION" in
            *-*) ;;
            *) nix develop -c crane tag "$image" latest ;;
          esac
      - name: Push the chart
        if: hashFiles('deploy/charts/harbor-operator/Chart.yaml') != ''
        run: |
          nix develop -c helm package deploy/charts/harbor-operator --version "$VERSION" --app-version "$VERSION" --destination build/chart
          nix develop -c helm push "build/chart/harbor-operator-$VERSION.tgz" oci://ghcr.io/soliddowant/charts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--latest)
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
          esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file build/release-notes.md "${flags[@]}"
