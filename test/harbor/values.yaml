# Harbor chart values for the integration test environment: plain HTTP behind
# a NodePort that kind maps to the host. up.sh adds externalURL and the node
# port. Images come from ghcr.io/goharbor, except the two Harbor does not
# publish there (nginx and harbor-db), which come from mirror.gcr.io. All are
# pinned by digest.
expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    ports:
      http:
        nodePort: 30002
harborAdminPassword: Harbor12345
persistence:
  enabled: false
trivy:
  enabled: false
metrics:
  enabled: false
nginx:
  image:
    repository: mirror.gcr.io/goharbor/nginx-photon
    tag: v2.15.4@sha256:7eff0287d5ad0f35754e162c8481ced04bbde107153ce586cefb15ee74fa1311
