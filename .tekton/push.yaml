# Runs the shared master push Pipeline (infra-mk3's
# cluster/gitops/ci/tekton/pipelines) with this repository's ci.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  # A fixed name collides with the previous run, which Pipelines-as-Code keeps.
  generateName: harbor-operator-push-
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "push" && target_branch == "master"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: ci-push
      - name: namespace
        value: ci-tekton
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: repo
      value: "{{ repo_owner }}/{{ repo_name }}"
    # The stages' CPU budget, the dind sidecar's CPU request below: three
    # Harbor kind clusters (integration and two e2e) and -race tests at once.
    # 6, not 12: the stages average under half a core each (the stage table's
    # CPU column), and a 12-CPU request fit on no node beside the cluster's
    # other reservations (2026-11-23).
    - name: cpus
      value: "6"
  timeouts:
    pipeline: 1h
  workspaces:
    - name: source
      emptyDir: {}
  taskRunSpecs:
    - pipelineTaskName: report
      serviceAccountName: ci-report
    # Every stage runs inside the dind sidecar's cgroup, so its memory is the
    # memory of all stages together: 1.5 times the measured peak (the stage
    # table prints it; 6.3 GiB on 2026-11-23). No CPU limit; the request is the
    # stages' CPU budget.
    - pipelineTaskName: ci
      sidecarSpecs:
        - name: dind
          computeResources:
            requests:
              cpu: "6"
              memory: 10Gi
            limits:
              memory: 10Gi
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
